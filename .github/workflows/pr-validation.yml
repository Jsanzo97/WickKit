name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - run: ./gradlew detekt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: '**/build/reports/detekt/'
          retention-days: 7

  spotless:
    name: Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - run: ./gradlew spotlessCheck

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - run: ./gradlew testDebugUnitTest jacocoRootReport
      - name: Check coverage ≥ 95%
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml')
          for c in tree.getroot().findall('counter'):
              if c.get('type') == 'LINE':
                  missed, covered = int(c.get('missed')), int(c.get('covered'))
                  pct = covered / (missed + covered) * 100
                  print(f'Line coverage: {pct:.1f}% ({covered}/{missed + covered} lines)')
                  if pct < 95:
                      print(f'::error::Coverage {pct:.1f}% is below the 95% minimum')
                      sys.exit(1)
                  sys.exit(0)
          print('::error::No LINE counter found in report')
          sys.exit(1)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/jacocoRootReport/
          retention-days: 1
